name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,langfuse]"
      - name: Lint
        run: ruff check .
      - name: Tests (replay mode, no LLM key)
        env:
          DEMO_MODE: replay
        run: pytest -q
      - name: Eval smoke (deterministic fixtures)
        env:
          DEMO_MODE: replay
        run: python -m app.evals.runner

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -t recruiting-assistant:ci .
