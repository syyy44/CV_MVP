[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "recruiting-assistant"
version = "0.1.0"
description = "Evidence-led AI recruiting assistant: observable, validated, replayable screening workflow"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "langgraph>=0.6",
    "openai>=1.40",
    "httpx>=0.27",
    "pypdf>=4.3",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
langfuse = ["langfuse>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
